<html>

<head>
    <title>A3 progressive basic academic</title>
    <!-- School Logo / Favicon -->
    <link rel="icon" type="image/png" href="./school-logo.jpg">
    <!-- import custom  CSS -->
    <link rel="stylesheet" href="./Apply Now.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- owl carousel -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />
</head>

<!-- ================= APPLY NOW ================= -->
<section class="apply-section" id="apply">

    <div class="container">
        <div class="apply-section-logo">
            <img src="./school-logo.jpg" alt="A3 Progressive School Logo">
        </div>
        <div class="section-title-bar">
            <span class="section-subtitle">JOIN OUR SCHOOL</span>
            <h2 class="section-title">Apply Now</h2>
        </div>


        <div class="apply-wrapper">

            <!-- Left Side -->
            <div class="apply-content">

                <div class="apply-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>

                <h2>Start Your Child's Journey With Us</h2>

                <p>
                    Give your child the opportunity to learn,
                    grow and build a bright future at A3 Progressive
                    Basic Academic.
                </p>

                <div class="apply-features">

                    <div>
                        <i class="fas fa-check-circle"></i>
                        Quality Education
                    </div>

                    <div>
                        <i class="fas fa-check-circle"></i>
                        Qualified Teachers
                    </div>

                    <div>
                        <i class="fas fa-check-circle"></i>
                        Friendly Learning Environment
                    </div>

                    <div>
                        <i class="fas fa-check-circle"></i>
                        Modern Learning Facilities
                    </div>

                </div>

            </div>


            <!-- Application Form -->
            <div class="apply-form-container">

                <h3>Application Form</h3>

                <form class="apply-form">

                    <div class="form-row">

                        <div class="form-group">
                            <label for="student-name">
                                Student Name
                            </label>

                            <input type="text" id="student-name" placeholder="Enter student's name" required>
                        </div>


                        <div class="form-group">
                            <label for="parent-name">
                                Parent/Guardian Name
                            </label>

                            <input type="text" id="parent-name" placeholder="Enter parent/guardian name" required>
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="apply-email">
                                Email Address
                            </label>

                            <input type="email" id="apply-email" placeholder="Enter email address" required>
                        </div>


                        <div class="form-group">
                            <label for="apply-phone">
                                Phone Number
                            </label>

                            <input type="tel" id="apply-phone" placeholder="Enter phone number" required>
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="class">
                                Class Applying For
                            </label>

                            <select id="class" required>

                                <option value="">
                                    Select class
                                </option>

                                <option>Primary 1</option>
                                <option>Primary 2</option>
                                <option>Primary 3</option>
                                <option>Primary 4</option>
                                <option>Primary 5</option>
                                <option>Primary 6</option>
                                <option>JSS 1</option>
                                <option>JSS 2</option>
                                <option>JSS 3</option>

                            </select>

                        </div>


                        <div class="form-group">
                            <label for="session">
                                Academic Session
                            </label>

                            <select id="session" required>

                                <option value="">
                                    Select session
                                </option>

                                <option>2026/2027</option>
                                <option>2027/2028</option>

                            </select>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="apply-message">
                            Additional Information
                        </label>

                        <textarea id="apply-message" rows="5"
                            placeholder="Enter any additional information..."></textarea>

                    </div>


                    <button type="submit" class="apply-submit-btn">

                        Submit Application

                        <i class="fas fa-paper-plane"></i>

                    </button>

                </form>

            </div>

        </div>

    </div>

</section>

</html>
